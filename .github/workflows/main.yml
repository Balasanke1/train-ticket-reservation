name: CI/CD Pipeline with tomcat

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Validate
      - name: Validate
        run: mvn validate


      # 4. Compile
      - name: Compile
        run: mvn compile


      # 5. Test
      - name: Test
        run: mvn test


      # 6. Package
      - name: Package
        run: mvn package
     
      # 7. Deploy to tomcat
      - name: Deploy to Tomcat
        run: |

                curl -v -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
                   -T target/Trainbook-1.0.0-SNAPSHOT.war \
                   "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/mywebApp&update=true"  
